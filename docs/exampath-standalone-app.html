<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ExamPath — Every exam. Every date. One place.</title>
<meta name="description" content="Track every Indian government exam — notifications, dates, vacancies, eligibility, results — in one clean place.">
<style>
:root{
  --brand:#1d4ed8; --brand-d:#1e3a8a; --brand-l:#3b82f6; --brand-soft:#eff4ff; --brand-100:#dbe6fe;
  --saffron:#f97316; --saffron-d:#ea580c; --saffron-soft:#fff4ec;
  --ink:#0f1c33; --ink-2:#334155; --muted:#64748b; --faint:#94a3b8;
  --line:#e6ebf2; --line-2:#eef2f7; --bg:#f5f7fb; --card:#ffffff;
  --green:#0e9f6e; --green-soft:#e7f8f0; --red:#e02424; --red-soft:#fdeaea;
  --amber:#c27803; --amber-soft:#fdf6e3; --violet:#7c3aed; --violet-soft:#f3ecfe;
  --r:16px; --r-sm:11px; --r-lg:22px;
  --sh-s:0 1px 2px rgba(16,32,64,.06); --sh:0 6px 20px -10px rgba(16,32,64,.18);
  --sh-l:0 20px 48px -20px rgba(16,32,64,.28);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --head:"Segoe UI",var(--sans);
  --wrap:1160px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;font-size:15.5px;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img,svg{display:block}
h1,h2,h3,h4{margin:0;font-family:var(--head);letter-spacing:-.02em;line-height:1.18}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
.mono{font-variant-numeric:tabular-nums}

/* ---------------- Header ---------------- */
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.03em;color:var(--ink);flex:none}
.logo .glyph{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand-l),var(--saffron));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;box-shadow:var(--sh-s)}
.logo b{color:var(--brand)} .logo i{font-style:normal;color:var(--saffron)}
.navlinks{display:flex;gap:4px;margin-left:6px}
.navlinks a{padding:8px 13px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.navlinks a:hover{background:var(--brand-soft);color:var(--brand)}
.navlinks a.active{color:var(--brand);background:var(--brand-soft)}
.top .search{margin-left:auto;flex:1;max-width:340px;position:relative}
.top .search input{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 14px 0 40px;font-size:14.5px;background:#fff;color:var(--ink)}
.top .search input:focus{outline:none;border-color:var(--brand-l);box-shadow:0 0 0 4px var(--brand-soft)}
.top .search svg{position:absolute;left:13px;top:12px;color:var(--faint)}
.btn-login{flex:none;height:42px;padding:0 16px;border-radius:11px;background:var(--brand);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.btn-login:hover{background:var(--brand-d)}
@media(max-width:860px){.navlinks,.top .search,.btn-login{display:none}}

/* ---------------- Buttons / chips ---------------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:14.5px;transition:.15s}
.btn.pri{background:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-d)}
.btn.saf{background:var(--saffron);color:#fff}.btn.saf:hover{background:var(--saffron-d)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--brand-l);color:var(--brand)}
.btn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;letter-spacing:.01em;padding:4px 10px;border-radius:999px;text-transform:uppercase}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.p-open{background:var(--brand-soft);color:var(--brand)} .p-result{background:var(--green-soft);color:var(--green)}
.p-admit{background:var(--amber-soft);color:var(--amber)} .p-soon{background:var(--red-soft);color:var(--red)}
.p-up{background:var(--violet-soft);color:var(--violet)} .p-done{background:#eef1f5;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--ink-2);background:#f1f5fb;border:1px solid var(--line);padding:3px 9px;border-radius:8px}

/* ---------------- Cards ---------------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-s)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.sec-title h2{font-size:21px;font-weight:800}
.sec-title a{font-size:13.5px;font-weight:700;color:var(--brand)}
.muted{color:var(--muted)} .small{font-size:13px}

/* ---------------- Home hero ---------------- */
.hero{position:relative;background:
   radial-gradient(1200px 380px at 80% -60%, rgba(249,115,22,.14), transparent 60%),
   radial-gradient(900px 420px at 0% -40%, rgba(59,130,246,.18), transparent 55%),
   linear-gradient(180deg,#0e1a34,#12244a);
   color:#fff;padding:46px 0 120px;overflow:hidden}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#bcd0f5;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:999px}
.hero h1{font-size:39px;font-weight:800;margin:16px 0 10px;letter-spacing:-.035em;max-width:640px}
.hero h1 .u{background:linear-gradient(120deg,#ffd7a8,var(--saffron));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p.sub{font-size:17px;color:#c9d6ee;max-width:560px;margin:0 0 24px}
.searchbig{background:#fff;border-radius:16px;padding:8px;display:flex;gap:8px;max-width:640px;box-shadow:var(--sh-l)}
.searchbig input{flex:1;border:none;height:48px;padding:0 8px 0 16px;font-size:16px;color:var(--ink);border-radius:12px}
.searchbig input:focus{outline:none}
.searchbig .btn{height:48px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chips .c{font-size:13px;font-weight:600;color:#dbe6fe;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);padding:7px 13px;border-radius:999px}
.chips .c:hover{background:rgba(255,255,255,.18)}
.hero-stats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.hero-stats .s b{display:block;font-size:24px;font-weight:800}
.hero-stats .s span{font-size:12.5px;color:#bcd0f5}

/* pull content up over hero */
.pull{margin-top:-84px;position:relative;z-index:5}

/* ---------------- Deadline strip ---------------- */
.dl-strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}
.dl-strip::-webkit-scrollbar{height:6px}.dl-strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.dl-card{scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:14px;padding:14px 15px;box-shadow:var(--sh-s)}
.dl-card:hover{box-shadow:var(--sh);transform:translateY(-1px);transition:.15s}
.dl-card .cd{font-size:26px;font-weight:800;color:var(--red);letter-spacing:-.03em}
.dl-card .cd small{font-size:12px;font-weight:700;color:var(--muted)}
.dl-card h4{font-size:14.5px;margin:6px 0 2px;font-weight:750}

/* ---------------- Exam card ---------------- */
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.xcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh-s);display:flex;flex-direction:column;gap:10px;transition:.15s}
.xcard:hover{box-shadow:var(--sh);transform:translateY(-2px);border-color:var(--brand-100)}
.xcard .row1{display:flex;align-items:center;gap:10px}
.xcard .badge{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.xcard h3{font-size:16px;font-weight:750}
.xcard .meta{font-size:12.5px;color:var(--muted)}
.xcard .facts{display:flex;gap:16px;padding-top:4px;border-top:1px dashed var(--line);margin-top:2px}
.xcard .facts .f b{display:block;font-size:15px;font-weight:800}
.xcard .facts .f span{font-size:11px;color:var(--muted)}
.xcard .cta{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.xcard .heart{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.xcard .heart.on{color:var(--saffron);border-color:var(--saffron);background:var(--saffron-soft)}

/* body-grid (conducting bodies) */
.body-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;box-shadow:var(--sh-s);transition:.15s}
.bcard:hover{box-shadow:var(--sh);transform:translateY(-2px);border-color:var(--brand-100)}
.bcard .ic{width:48px;height:48px;border-radius:13px;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
.bcard b{font-size:14.5px} .bcard span{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* ---------------- Feed ---------------- */
.feed{display:flex;flex-direction:column}
.feed .it{display:flex;gap:13px;padding:14px 4px;border-bottom:1px solid var(--line-2)}
.feed .it:last-child{border-bottom:none}
.feed .it .ic{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.feed .it h4{font-size:14.5px;font-weight:700;margin-bottom:2px}
.feed .it p{margin:0;font-size:13px;color:var(--muted)}
.feed .it .t{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap;flex:none}

/* ---------------- Dashboard ---------------- */
.dash-hero{background:linear-gradient(135deg,#12244a,#1d3f7a);color:#fff;border-radius:var(--r-lg);padding:24px;box-shadow:var(--sh);position:relative;overflow:hidden}
.dash-hero:before{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(249,115,22,.35),transparent 65%)}
.dash-hero .body-tag{font-size:12.5px;font-weight:700;color:#bcd0f5}
.dash-hero h1{font-size:29px;font-weight:800;margin:4px 0 12px}
.dash-hero .countbox{display:flex;gap:10px;margin-top:6px}
.count-unit{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 14px;text-align:center;min-width:62px}
.count-unit b{display:block;font-size:24px;font-weight:800}
.count-unit span{font-size:10.5px;color:#bcd0f5;text-transform:uppercase;letter-spacing:.05em}
.dash-hero .deadline-label{font-size:13px;color:#dbe6fe;margin-top:10px}

.dash-grid{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-top:16px}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px;box-shadow:var(--sh-s);margin-bottom:16px}
.panel h3{font-size:16px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.panel h3 .n{width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:800}

/* timeline */
.timeline{display:flex;gap:0;overflow-x:auto;padding:10px 2px 6px}
.timeline::-webkit-scrollbar{height:6px}.timeline::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.tl-node{flex:1;min-width:104px;position:relative;text-align:center;padding-top:26px}
.tl-node:before{content:"";position:absolute;top:9px;left:calc(-50% + 9px);width:100%;height:3px;background:var(--line)}
.tl-node:first-child:before{display:none}
.tl-node .dot{position:absolute;top:2px;left:calc(50% - 9px);width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--line);z-index:2}
.tl-node.done .dot{background:var(--green);border-color:var(--green)}
.tl-node.done:before{background:var(--green)}
.tl-node.now .dot{background:var(--saffron);border-color:var(--saffron);box-shadow:0 0 0 5px var(--saffron-soft)}
.tl-node.now:before{background:linear-gradient(90deg,var(--green),var(--saffron))}
.tl-node b{font-size:12.5px;font-weight:700;display:block}
.tl-node span{font-size:11px;color:var(--muted)}

/* key-date list */
.kd{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.kd:last-child{border-bottom:none}
.kd .date{width:56px;text-align:center;flex:none;background:var(--brand-soft);border-radius:10px;padding:6px 0;color:var(--brand)}
.kd .date b{display:block;font-size:17px;font-weight:800;line-height:1}
.kd .date span{font-size:10.5px;font-weight:700;text-transform:uppercase}
.kd .lab b{font-size:14px;font-weight:700}.kd .lab span{font-size:12px;color:var(--muted)}
.kd .rt{margin-left:auto;font-size:12px;font-weight:700}

/* table */
.dtable{width:100%;border-collapse:collapse;font-size:13.5px}
.dtable th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:2px solid var(--line)}
.dtable td{padding:9px 10px;border-bottom:1px solid var(--line-2)}
.dtable tr:last-child td{border-bottom:none}
.dtable td b{font-weight:750}

/* mini bar chart */
.bars{display:flex;align-items:flex-end;gap:12px;height:130px;padding:8px 4px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b .bar{width:100%;max-width:42px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--brand-l),var(--brand));position:relative}
.bars .b .bar.hl{background:linear-gradient(180deg,#fdba74,var(--saffron))}
.bars .b .bar span{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:11.5px;font-weight:800;color:var(--ink)}
.bars .b em{font-style:normal;font-size:11.5px;color:var(--muted)}

/* eligibility checker */
.elig{background:linear-gradient(135deg,var(--saffron-soft),#fff);border:1px solid #fde3cd}
.elig .inrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.elig label{font-size:12px;font-weight:700;color:var(--ink-2);display:block;margin-bottom:4px}
.elig input,.elig select{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;background:#fff;color:var(--ink)}
.elig input{width:96px}
.elig .res{margin-top:8px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px;display:none}
.elig .res.ok{display:block;background:var(--green-soft);color:var(--green)}
.elig .res.no{display:block;background:var(--red-soft);color:var(--red)}

/* sources */
.src{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.src:last-child{border-bottom:none}
.src .ic{width:34px;height:34px;border-radius:9px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.src b{font-size:13.5px;font-weight:700}.src span{font-size:11.5px;color:var(--muted)}
.src .go{margin-left:auto;color:var(--brand);font-weight:700;font-size:13px}

/* breadcrumb */
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin:16px 0 10px;flex-wrap:wrap}
.crumb a:hover{color:var(--brand)}

/* tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:11px 15px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

/* month strip */
.months{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px}
.months .m{flex:none;width:58px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:9px 0;background:#fff}
.months .m.has{border-color:var(--brand-100);background:var(--brand-soft)}
.months .m b{font-size:13px;font-weight:800;color:var(--ink)}
.months .m span{font-size:10.5px;color:var(--muted);display:block}
.months .m.has span{color:var(--brand);font-weight:700}

/* filter panel */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters .fchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.filters .fchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ---------------- Mobile bottom nav ---------------- */
.tabbar{display:none}
@media(max-width:860px){
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;font-size:10.5px;font-weight:700;color:var(--muted)}
  .tabbar a.active{color:var(--brand)}
  .tabbar a svg{width:22px;height:22px}
  body{padding-bottom:66px}
  .hero h1{font-size:30px}.hero{padding:26px 0 110px}
  .dash-hero h1{font-size:23px}
  .wrap{padding:0 15px}
}
section.page{padding:24px 0 40px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blk{margin-bottom:30px}
.foot{padding:26px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px;margin-top:20px}
.foot b{color:var(--ink)}
.note-demo{background:var(--amber-soft);border:1px solid #f3e2b8;color:#8a5a00;font-size:12.5px;padding:8px 13px;border-radius:10px;display:flex;gap:8px;align-items:center}
</style>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#/" onclick="go('/')"><span class="glyph"> E</span><span><b>Exam</b><i>Path</i></span></a>
    <nav class="navlinks" id="navlinks">
      <a href="#/" data-route="/">Home</a>
      <a href="#/bodies" data-route="/bodies">Exams</a>
      <a href="#/calendar" data-route="/calendar">Calendar</a>
      <a href="#/search" data-route="/search">Search</a>
    </nav>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="topSearch" placeholder="Search exams, e.g. SSC, age 21, graduate…" onkeydown="if(event.key==='Enter')doSearch(this.value)">
    </div>
    <button class="btn-login" onclick="toast('Login is wired to Supabase Auth in the full build ✨')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Login
    </button>
  </div>
</header>

<main id="app"></main>

<nav class="tabbar" id="tabbar">
  <a href="#/" data-route="/" onclick="go('/')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
  <a href="#/bodies" data-route="/bodies" onclick="go('/bodies')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>Exams</a>

function parseHash(){
  const h = location.hash.replace(/^#/,'') || '/';
  const [path, qs] = h.split('?');
  const q = new URLSearchParams(qs||'');
  return {path, q};
}
function setActiveNav(path){
  const base = '/'+(path.split('/')[1]||'');
  document.querySelectorAll('[data-route]').forEach(a=>{
    a.classList.toggle('active', a.dataset.route===base && base!=='/' || (a.dataset.route==='/'&&path==='/'));
    a.classList.toggle('active', a.dataset.route===(path==='/'?'/':base));
  });
}
function render(){
  const {path,q} = parseHash();
  const app = document.getElementById('app');
  let html='';
  if(path==='/' ) html = viewHome();
  else if(path==='/bodies') html = viewBodies();
  else if(path.startsWith('/body/')) html = viewBody(path.split('/')[2]);
  else if(path.startsWith('/exam/')) html = viewExam(path.split('/')[2]);
  else if(path==='/search') html = viewSearch(q.get('q')||'');
  else if(path==='/calendar') html = viewCalendar();
  else if(path==='/alerts') html = viewAlerts();
  else if(path==='/profile') html = viewProfile();
  else html = viewHome();
  app.innerHTML = html;
  setActiveNav(path);
  window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
  startCountdowns();
}

/* ---------- SEARCH ---------- */
function viewSearch(qraw){
  const q=(qraw||'').toLowerCase().trim();
  // naive natural-language parse
  const ageMatch=q.match(/age\s*(\d{2})|(\d{2})\s*(?:yrs?|years?)|\b(1[89]|2[0-9]|3[0-5])\b/);
  const age=ageMatch?parseInt(ageMatch[1]||ageMatch[2]||ageMatch[3]):null;
  let qualF=null;
  if(/graduat|degree|b\.?a|b\.?sc|b\.?com|b\.?tech/.test(q))qualF='graduate';
  else if(/12th|higher second|intermediate/.test(q))qualF='12th';
  else if(/10th|matric/.test(q))qualF='10th';
  let bodyF=null; Object.values(BODIES).forEach(b=>{if(q.includes(b.short.toLowerCase())||q.includes(b.name.toLowerCase().split(' ')[0]))bodyF=b.slug});
  if(/bank/.test(q))bodyF='ibps'; if(/rail|train/.test(q))bodyF='rrb';
  const soonF=/clos|soon|deadline|last date/.test(q);

  let res=CYCLES.filter(c=>{
    let ok=true;
    if(bodyF)ok=ok&&c.body===bodyF;
    if(qualF)ok=ok&&c.qcode===qualF;
    if(age)ok=ok&&(age>=c.ageMin&&age<=c.ageMax);
    if(soonF)ok=ok&&c.dates.some(d=>d.dl&&daysLeft(d.d)>=0&&daysLeft(d.d)<=30);
    if(!bodyF&&!qualF&&q&&!soonF)ok=ok&&(c.title+c.exam+c.summary+c.posts).toLowerCase().includes(q);
    return ok;
  });
  if(!q)res=CYCLES;
  const activeF=[bodyF&&BODIES[bodyF].short, qualF&&({graduate:'Graduate','12th':'12th pass','10th':'10th pass'})[qualF], age&&('Age '+age), soonF&&'Closing soon'].filter(Boolean);

  return `<section class="page"><div class="wrap">
    <div class="crumb"><a href="#/" onclick="go('/')">Home</a> › <span>Search</span></div>
    <div class="searchbig" style="max-width:100%;box-shadow:var(--sh-s);border:1px solid var(--line)">
      <input id="pageSearch" value="${(qraw||'').replace(/"/g,'&quot;')}" placeholder="Search exams, eligibility, body…" onkeydown="if(event.key==='Enter')doSearch(this.value)">
      <button class="btn pri" onclick="doSearch(document.getElementById('pageSearch').value)">Search</button>
    </div>
    <div class="filters" style="margin-top:16px">
      ${['graduate','12th','banking','closing soon','ssc','upsc'].map(f=>`<button class="fchip ${q.includes(f)?'on':''}" onclick="doSearch('${f}')">${f}</button>`).join('')}
    </div>
    ${activeF.length?`<div class="note-demo" style="margin-bottom:14px">🔎 Understood your search as: ${activeF.map(f=>`<b>${f}</b>`).join(' · ')} — this is the natural-language parser (§15).</div>`:''}
    <div class="sec-title"><h2>${res.length} exam${res.length!==1?'s':''} found</h2></div>
    ${res.length?`<div class="exam-grid">${res.map(examCard).join('')}</div>`:`<div class="card" style="padding:40px;text-align:center"><div style="font-size:34px">🔍</div><h3 style="margin:8px 0">No matches</h3><p class="muted">Try “graduate”, “SSC”, or “age 21”.</p></div>`}
    ${footer()}
  </div></section>`;
}

/* ---------- interactions ---------- */
function toggleFollow(id,el,isBtn){
  if(state.following.has(id)){state.following.delete(id);toast('Removed from your exams')}
  else{state.following.add(id);toast('★ Added — you\'ll get deadline alerts')}
  if(isBtn){render();return;}
  if(el){const on=state.following.has(id);el.classList.toggle('on',on);const svg=el.querySelector('svg');if(svg)svg.setAttribute('fill',on?'currentColor':'none');}
}
function checkElig(id){
  const c=byId(id);
  const age=parseInt(document.getElementById('eAge').value);
  const qual=document.getElementById('eQual').value;
  state.elig={age:age||'',qual};
  const rank={'10th':1,'12th':2,'graduate':3,'pg':4};
  const box=document.getElementById('eligRes');
  if(!age){box.className='res no';box.textContent='Please enter your age.';return;}
  const ageOk=age>=c.ageMin&&age<=c.ageMax;
  const qualOk=rank[qual]>=rank[c.qcode];
  if(ageOk&&qualOk){box.className='res ok';box.innerHTML='✓ You\'re eligible for '+c.exam+'! Age & qualification both match.';}
  else{box.className='res no';box.innerHTML='✕ Not eligible: '+[!ageOk?'age must be '+c.ageMin+'–'+c.ageMax:null,!qualOk?'needs '+c.qual:null].filter(Boolean).join(' · ')+'.';}
}
function saveProfile(){
  state.elig={age:parseInt(document.getElementById('pAge').value)||'',qual:document.getElementById('pQual').value};
  toast('✓ Profile saved — exams you qualify for will be highlighted');
}
let toastT;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(toastT);toastT=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)'},2600);
}

/* ---------- live countdowns ---------- */
let cdTimer;
function startCountdowns(){
  clearInterval(cdTimer);
  const tick=()=>{
    const now=new Date();
    document.querySelectorAll('[data-countdown]').forEach(el=>{
      const d=Math.ceil((new Date(el.dataset.countdown)-now)/86400000);
      el.firstChild.textContent=d;
    });
    document.querySelectorAll('[data-count-to]').forEach(box=>{
      const target=new Date(box.dataset.countTo+'T23:59:59');
      let diff=Math.max(0,target-now);
      const dd=Math.floor(diff/86400000);diff-=dd*86400000;
      const hh=Math.floor(diff/3600000);diff-=hh*3600000;
      const mm=Math.floor(diff/60000);
      const D=box.querySelector('.cu-d'),H=box.querySelector('.cu-h'),M=box.querySelector('.cu-m');
      if(D)D.textContent=dd;if(H)H.textContent=hh;if(M)M.textContent=mm;
    });
  };
  tick();cdTimer=setInterval(tick,30000);
}

/* ---------- tiny color shade util ---------- */
function shade(hex,pct){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)+pct,g=(n>>8&255)+pct,b=(n&255)+pct;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+(1<<24|r<<16|g<<8|b).toString(16).slice(1);
}
