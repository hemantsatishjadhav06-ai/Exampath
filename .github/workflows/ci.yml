name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests -t . -v
      - name: Run the pipeline (smoke)
        run: python -m app.pipeline.run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build static site (zero-dependency)
        run: node scripts/export-static.mjs
      - name: Check output exists
        run: test -f out/index.html && echo "build ok"
