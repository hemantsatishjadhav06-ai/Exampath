# Render Blueprint — deploy ExamPath with one click.
# In Render:  New → Blueprint → pick this repo → Apply.
# The same env-driven build command runs on GitHub Actions and Render.
services:
  # The student website — static, served at the domain root (no base path),
  # minified, with long-cache headers on hashed assets.
  - type: web
    name: exampath-web
    runtime: static
    buildCommand: cd web && MINIFY=1 SITE_URL="$RENDER_EXTERNAL_URL" node scripts/export-static.mjs
    staticPublishPath: web/out
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.svg
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: Cache-Control
        value: public, max-age=600
    routes:
      - type: rewrite
        source: /sw.js
        destination: /sw.js

  # OPTIONAL: the Python API + n8n webhook (comment out if you only want the site)
  - type: web
    name: exampath-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    envVars:
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
